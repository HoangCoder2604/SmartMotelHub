<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="smh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="smh-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="smh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="12" fill="url(#smh-grad)" />

  <!-- Outer subtle glow rim -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Modern geometric house roof -->
  <path d="M12 24L24 13L36 24" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#smh-shadow)" />

  <!-- House Body -->
  <path d="M16 23.5V34C16 34.8284 16.6716 35.5 17.5 35.5H30.5C31.3284 35.5 32 34.8284 32 34V23.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Smart Hub Beacon / Keyhole / WiFi signal waves -->
  <circle cx="24" cy="24" r="2.8" fill="url(#smh-accent)" />
  <path d="M24 29V32" stroke="url(#smh-accent)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M20 20C21.1 18.9 22.5 18.2 24 18.2C25.5 18.2 26.9 18.9 28 20" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
</svg>
