services:
  db:
    image: postgis/postgis:17-3.5
    container_name: smartmotel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartmotel}
      POSTGRES_USER: ${POSTGRES_USER:-smartmotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmotel_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartmotel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartmotel} -d ${POSTGRES_DB:-smartmotel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smartmotel-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartmotel}:${POSTGRES_PASSWORD:-smartmotel_dev_password}@db:5432/${POSTGRES_DB:-smartmotel}?schema=public
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smartmotel-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  smartmotel_postgres_data:
